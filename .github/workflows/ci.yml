name: AR2 CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Lint
      run: |
        pip install ruff
        ruff check app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/test_db"
      run: |
        PYTHONPATH=. pytest app/tests/

    - name: Checkout Pancake
      uses: actions/checkout@v4
      with:
        repository: agstack/pancake
        ref: day4-fixes
        path: pancake
        token: ${{ secrets.AGSTACK_PAT }}

    - name: Start Servers and Run E2E
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/test_db"
        AR_TRUSTED_ISSUER_PUBKEY: ${{ github.workspace }}/pancake/services/pancake_services/grants/testkit/dev_keys/dev_issuer_public.pem
        AR_TRUSTED_AUTHORITY_PUBKEY: ${{ github.workspace }}/app/tests/testkit/dev_keys/authority_issuer_public.pem
      run: |
        pip install -r pancake/services/requirements.txt
        cd pancake/services
        python -m pancake_services.grants.testkit.mint_test_credentials
        DATABASE_URL="" uvicorn pancake_services.grants.app:app --port 8100 &
        cd $GITHUB_WORKSPACE
        uvicorn app.main:app --port 8000 &
        sleep 5
        ./demo_e2e.sh
        ./scripts/e2e_traceforward.sh
